name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradewars
          POSTGRES_PASSWORD: tradewars
          POSTGRES_DB: tradewars
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tradewars"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TW_DATABASE_URL: postgresql+asyncpg://tradewars:tradewars@localhost:5432/tradewars
      TW_JWT_SECRET: test-secret
      TW_TICK_API_KEY: test-tick-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest -v

  docker:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/discourse-tradewars-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/discourse-tradewars-api:sha-${{ github.sha }}
