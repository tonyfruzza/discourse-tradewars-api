apiVersion: apps/v1
kind: Deployment
metadata:
  name: discourse-tradewars-api
  namespace: discourse
  labels:
    app: discourse-tradewars-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discourse-tradewars-api
  template:
    metadata:
      labels:
        app: discourse-tradewars-api
    spec:
      containers:
        - name: api
          image: tonyfruzza/discourse-tradewars-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tradewars-secret
            - configMapRef:
                name: tradewars-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
